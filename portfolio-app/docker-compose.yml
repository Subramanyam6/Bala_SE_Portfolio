services:
  backend:
    build: ./backend
    container_name: portfolio-backend
    environment:
      JWT_SECRET: your-secret-key-here-should-be-very-long-and-secure-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5174,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - portfolio-network

  frontend:
    build: ./frontend
    container_name: portfolio-frontend
    depends_on:
      - backend
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:80"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
