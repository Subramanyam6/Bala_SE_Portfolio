# Local Development Configuration (no database)
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-jwt-secret-key}
jwt.expiration=86400000

# Logging for Development
logging.level.org.springframework.security=DEBUG
logging.level.web=DEBUG
logging.level.com.portfolio.backend=DEBUG

# CORS Configuration for Local Development
cors.allowed-origins=http://localhost:3000,http://localhost:5174
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Postmark Configuration
postmark.server.token=${POSTMARK_SERVER_TOKEN:dummy-key-for-development}
postmark.from.email=${POSTMARK_FROM_EMAIL:bduggirala2@huskers.unl.edu}

# Spring Web CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
