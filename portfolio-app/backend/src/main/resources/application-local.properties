# Local Development Configuration
server.port=8080

# Disable database auto-configuration (app runs without a DB)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-jwt-secret-key}
jwt.expiration=86400000

# Logging for Development
logging.level.org.springframework.security=DEBUG
logging.level.web=DEBUG
logging.level.com.bala.portfolio=DEBUG

# CORS Configuration for Local Development
cors.allowed-origins=http://localhost:5174
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Postmark Configuration
postmark.server.token=${POSTMARK_SERVER_TOKEN:${POSTMARK_API_KEY:}}
postmark.from.email=${POSTMARK_FROM_EMAIL:bduggirala2@huskers.unl.edu}
postmark.message.stream=${POSTMARK_MESSAGE_STREAM:outbound}

# Spring Web CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=* 
