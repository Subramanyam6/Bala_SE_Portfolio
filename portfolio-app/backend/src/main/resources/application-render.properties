# Render configuration (no database)

# Server Configuration
server.port=10000

# Postmark Email Configuration
postmark.server.token=${POSTMARK_SERVER_TOKEN}
postmark.from.email=${POSTMARK_FROM_EMAIL:bduggirala2@huskers.unl.edu}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS Configuration
# Render will inject the frontend URL automatically
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# Spring Web CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.portfolio.backend=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Health Check Endpoint (Render needs this)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
