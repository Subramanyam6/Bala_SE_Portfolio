# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.portfolio=DEBUG
 
# Disable database auto-configuration (app runs without a DB)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://portfolio-front-app.azurestaticapps.net}
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://portfolio-front-app.azurestaticapps.net}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Application Security
spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}

# Postmark Configuration
postmark.server.token=${POSTMARK_SERVER_TOKEN:${POSTMARK_API_KEY:}}
postmark.from.email=${POSTMARK_FROM_EMAIL:bduggirala2@huskers.unl.edu}
postmark.message.stream=${POSTMARK_MESSAGE_STREAM:outbound}

# JWT Configuration for Azure
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Azure App Service-specific settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always 
